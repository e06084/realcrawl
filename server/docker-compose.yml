version: '3.8'

services:
  # 应用服务
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - SECRET_KEY=your-production-secret-key
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=realcrawl
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=realcrawl
      - REDIS_CLUSTER_NODES=redis1:6379,redis2:6379,redis3:6379
      - S3_BUCKET=realcrawl-html
      - S3_REGION=us-east-1
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      - postgres
      - redis1
      - redis2
      - redis3
      - clickhouse
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # PostgreSQL数据库
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=realcrawl
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=realcrawl
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis集群节点1
  redis1:
    image: redis:7-alpine
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis1_data:/data
    restart: unless-stopped

  # Redis集群节点2
  redis2:
    image: redis:7-alpine
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis2_data:/data
    restart: unless-stopped

  # Redis集群节点3
  redis3:
    image: redis:7-alpine
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - redis3_data:/data
    restart: unless-stopped

  # Redis集群初始化
  redis-cluster-init:
    image: redis:7-alpine
    command: >
      sh -c "
      echo 'Waiting for Redis nodes to start...'
      sleep 10
      redis-cli --cluster create redis1:6379 redis2:6379 redis3:6379 --cluster-replicas 0 --cluster-yes
      "
    depends_on:
      - redis1
      - redis2
      - redis3

  # ClickHouse日志数据库
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/custom.xml
    environment:
      - CLICKHOUSE_DB=realcrawl
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    restart: unless-stopped

  # MinIO (S3兼容存储)
  minio:
    image: minio/minio:latest
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  # Grafana仪表板
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Celery Worker任务队列
  celery:
    build: .
    command: celery -A app.celery worker --loglevel=info
    environment:
      - DEBUG=false
      - SECRET_KEY=your-production-secret-key
      - POSTGRES_HOST=postgres
      - REDIS_CLUSTER_NODES=redis1:6379,redis2:6379,redis3:6379
    depends_on:
      - postgres
      - redis1
      - app
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Celery Beat调度器
  celery-beat:
    build: .
    command: celery -A app.celery beat --loglevel=info
    environment:
      - DEBUG=false
      - SECRET_KEY=your-production-secret-key
      - POSTGRES_HOST=postgres
      - REDIS_CLUSTER_NODES=redis1:6379,redis2:6379,redis3:6379
    depends_on:
      - postgres
      - redis1
      - celery
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis1_data:
  redis2_data:
  redis3_data:
  clickhouse_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge 